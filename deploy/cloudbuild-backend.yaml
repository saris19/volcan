steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_REGISTRY}/backend:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGISTRY}/envoy:${_TAG}", "envoy"]
images:
  - "${_REGISTRY}/backend:${_TAG}"
  - "${_REGISTRY}/envoy:${_TAG}"
